name: lint
on:
  workflow_call:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck contracts/factory-task tests/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: remote actions pinned to a commit SHA
        run: |
          if grep -rnE --include='*.yml' --include='*.yaml' '^[[:space:]]*(- )?uses:' .github | grep -vE 'uses:[[:space:]]+(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$))'; then
            echo "::error::pin every remote uses: to a 40-character commit SHA"; exit 1
          fi
