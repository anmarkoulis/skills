name: test
on:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # macOS /bin/bash is 3.2, the oldest bash the scripts must run on
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: /bin/bash tests/factory-task.test.sh
      - run: /bin/bash tests/frontmatter.test.sh
