schema_version: "1.1"
name: code-schematic-trigger
description: "a request phrased like the code-schematic description fires code-schematic"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Draw me the flow of how cart.total applies a discount code.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-code-schematic
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:code-schematic"'
