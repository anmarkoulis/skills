schema_version: "1.1"
name: debugging-trigger
description: "a request phrased like the debugging description fires debugging"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    SAVE10 on a $200 order comes out at $100 instead of $180. Find the root cause of this bug. Diagnose only, don't fix anything.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-debugging
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:debugging"'
