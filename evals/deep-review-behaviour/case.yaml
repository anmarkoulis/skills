schema_version: "1.1"
name: deep-review-behaviour
description: "deep-review writes local files and never posts"
tags: [behaviour]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Deep review my uncommitted changes against HEAD. I want the intent and a walkthrough, not just a bug list.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  timeout_seconds: 600
graders:
  - name: fires-deep-review
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:deep-review"'
  - name: writes-review
    type: file_exists
    path: "**/review.md"
  - name: writes-comments
    type: file_exists
    path: "**/comments.md"
  - name: never-posts
    type: tool_used
    tool: Bash
    input_match: 'gh (pr|issue|api)|--comment|--post'
    min: 0
    max: 0
    arm: both
