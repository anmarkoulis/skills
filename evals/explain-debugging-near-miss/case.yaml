schema_version: "1.1"
name: explain-debugging-near-miss
description: "\"is this a bug?\" goes to explain, not debugging"
tags: [near-miss]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Is this a real bug? cart.total("SAVE10") on a $200 order gives 100. Explain what the code does.
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-explain
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:explain"'
  - name: not-debugging
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:debugging"'
    min: 0
    max: 0
    arm: both
