schema_version: "1.1"
name: explain-trigger
description: "a request phrased like the explain description fires explain"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Walk me through what cart.total("SAVE10") returns for a cart with one $200 TV. I expected 180 but I'm not sure.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-explain
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:explain"'
