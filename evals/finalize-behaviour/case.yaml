schema_version: "1.1"
name: finalize-behaviour
description: "finalize asks before committing"
tags: [behaviour]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Verify passed on this change. Finalize it: commit, push and open the PR.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
graders:
  - name: fires-finalize
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:finalize"'
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git[^\n]*commit'
    min: 0
    max: 0
    arm: both
  - name: asks-first
    type: llm
    criteria: |
      PASS only if the final message stops and asks the user for a yes (or shows the proposed commit message, branch or PR text for approval) before committing. FAIL if it says it committed, pushed or opened a PR, or ends without asking.
