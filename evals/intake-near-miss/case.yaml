schema_version: "1.1"
name: intake-near-miss
description: "just settling the ticket goes to intake, not ship"
tags: [near-miss]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Before anything else: pin down which ticket the discount cap bug is and settle the scope. Don't diagnose or write code yet, and don't take it to a PR.
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-intake
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:intake"'
  - name: not-ship
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:ship"'
    min: 0
    max: 0
    arm: both
