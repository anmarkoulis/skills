schema_version: "1.1"
name: plan-trigger
description: "a request phrased like the plan description fires plan"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We understand the discount cap bug now: the cap compares the order total instead of the discount. Write plan.md for the fix: tasks, tests first, verification, and which agent runs each task.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-plan
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:plan"'
