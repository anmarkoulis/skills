schema_version: "1.1"
name: qa-tests-trigger
description: "a request phrased like the qa-tests description fires qa-tests"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Does this repo have an acceptance or end-to-end suite? Run it for the discount area and tell me which scenarios cover the touched code.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-qa-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:qa-tests"'
