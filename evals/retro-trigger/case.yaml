schema_version: "1.1"
name: retro-trigger
description: "a request phrased like the retro description fires retro"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The discount cap task stopped early. Run a post-mortem on its task folder: record the lessons and propose skill edits, agents and checks.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-retro
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:retro"'
