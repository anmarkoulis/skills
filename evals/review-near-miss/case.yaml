schema_version: "1.1"
name: review-near-miss
description: "pipeline review at T1 goes to review, not deep-review"
tags: [near-miss]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We're in the review step after build and simplify; the tier is T1. Review the discount cap change at that depth and agree which findings to fix.
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-review
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:review"'
  - name: not-deep-review
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:deep-review"'
    min: 0
    max: 0
    arm: both
