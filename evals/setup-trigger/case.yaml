schema_version: "1.1"
name: setup-trigger
description: "a request phrased like the setup description fires setup"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Set up the factory here: declare this repo's layers in AGENTS.md and scaffold the variant skills before the first run.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-setup
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:setup"'
