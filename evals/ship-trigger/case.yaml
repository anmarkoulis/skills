schema_version: "1.1"
name: ship-trigger
description: "a request phrased like the ship description fires ship"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Fix this bug end to end: SAVE10 on large orders is capped at $100 off the total instead of the discount. Take it the full way to an open PR and a retro.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-ship
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:ship"'
