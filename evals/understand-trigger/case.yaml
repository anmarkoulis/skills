schema_version: "1.1"
name: understand-trigger
description: "a request phrased like the understand description fires understand"
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Intake and tier are done for the discount cap ticket, which is a bug. Before plan, make sure the work is understood: route it by ticket type.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-understand
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:understand"'
