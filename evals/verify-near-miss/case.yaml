schema_version: "1.1"
name: verify-near-miss
description: "\"what is covered\" goes to verify, not qa-tests"
tags: [near-miss]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Verify this change and tell me what is covered and what is not proven.
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-verify
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:verify"'
  - name: not-qa-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"anmarkoulis:qa-tests"'
    min: 0
    max: 0
    arm: both
